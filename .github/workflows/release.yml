name: Build and release config tools

on:
  pull_request:
  push:
    branches: [main]
    tags: ['pulsarconfig-v*', 'magnetarconfig-v*']
  workflow_dispatch:
    inputs:
      tool:
        description: Tool to build (publishes only from main)
        type: choice
        options: [all, PulsarConfig, MagnetarConfig]
        default: all

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      releases: ${{ steps.select.outputs.releases }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test release planning and promotion
        run: python Scripts/test-release.py
      - id: select
        env:
          SELECTED_TOOL: ${{ inputs.tool || 'all' }}
        run: python Scripts/release.py plan

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test tool
        run: dotnet test ${{ matrix.tool }}Tests/${{ matrix.tool }}Tests.csproj -c Release
      - name: Publish standalone executable and test self-replacement
        shell: pwsh
        env:
          TOOL: ${{ matrix.tool }}
          RID: ${{ matrix.rid }}
          EXPECTED_VERSION: ${{ matrix.version }}
        run: |
          $preview = $env:GITHUB_REF -ne 'refs/heads/main' -and $env:GITHUB_REF -notlike 'refs/tags/*'
          ./Scripts/publish.ps1 -Tool $env:TOOL -Rid $env:RID -ExpectedVersion $env:EXPECTED_VERSION -Preview:$preview
      - uses: actions/upload-artifact@v4
        with:
          name: config-tools-${{ matrix.tool }}-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: [select, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.releases) }}
    concurrency:
      group: config-tools-release-${{ matrix.tool }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: config-tools-${{ matrix.tool }}-*
          merge-multiple: true
          path: dist
      - name: Add notices and checksums
        run: |
          cp LICENSE dist/LICENSE.txt
          cp Licenses/*.txt dist/
          chmod +x dist/*.bin
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Publish the configured version and delete previous releases
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: ${{ matrix.tool }}
          VERSION: ${{ matrix.version }}
        run: python Scripts/release.py publish "$TOOL" "$VERSION" dist
