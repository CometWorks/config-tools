name: Build and release config tools

on:
  pull_request:
  push:
    branches: [main]
    tags: ['pulsarconfig-v*', 'magnetarconfig-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: python {0}
        run: |
          import json, os, re
          ref = os.environ['GITHUB_REF']
          rows = [
              {'tool': 'PulsarConfig', 'os': 'ubuntu-latest', 'rid': 'linux-x64'},
              {'tool': 'MagnetarConfig', 'os': 'ubuntu-latest', 'rid': 'linux-x64'},
              {'tool': 'MagnetarConfig', 'os': 'windows-latest', 'rid': 'win-x64'},
          ]
          if ref.startswith('refs/tags/'):
              match = re.fullmatch(r'(pulsarconfig|magnetarconfig)-v(\d+\.\d+\.\d+)', os.environ['GITHUB_REF_NAME'])
              if not match:
                  raise SystemExit('Use pulsarconfig-vX.Y.Z or magnetarconfig-vX.Y.Z for stable releases')
              rows = [row for row in rows if row['tool'].lower() == match[1]]
              for row in rows:
                  row['version'] = match[2]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': rows}) + '\n')

  build:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test tool
        run: dotnet test ${{ matrix.tool }}Tests/${{ matrix.tool }}Tests.csproj -c Release
      - name: Publish standalone executable and test self-replacement
        shell: pwsh
        env:
          TOOL: ${{ matrix.tool }}
          RID: ${{ matrix.rid }}
          RELEASE_VERSION: ${{ matrix.version }}
        run: |
          $version = $env:RELEASE_VERSION
          if (-not $version) {
            $version = ([xml](Get-Content "$env:TOOL/$env:TOOL.csproj")).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $version += '-dev'
          }
          ./Scripts/publish.ps1 -Tool $env:TOOL -Rid $env:RID -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: config-tools-${{ matrix.tool }}-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: config-tools-*
          merge-multiple: true
          path: dist
      - name: Add notices and checksums
        run: |
          cp LICENSE dist/LICENSE.txt
          cp Licenses/*.txt dist/
          chmod +x dist/*.bin
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Create independent tool release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
